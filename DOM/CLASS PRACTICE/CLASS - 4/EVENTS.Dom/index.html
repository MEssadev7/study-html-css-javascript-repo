<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="script.js" async></script>
  </head>
  <body>
    <!-- click functtion -->
    <h1>EVENTS</h1>
    <button id="clickBtn">Click me</button>
    <p id="message">waiting for message</p>
    <!-- mode change  -->
    <button id="darkMD">dark mode</button>
    <button id="lightMD">light mode</button>

    <!-- input  -->

    <div class="">
      <input type="text" id="search" placeholder="enter key word" />
      <button id="showinputResult">show result</button>
      <p id="output"></p>
    </div>

    <!-- drop down  -->
    <select id="curse">
      <option value="">select a course</option>
      <option value="html">html</option>
      <option value="css">css</option>
      <option value="javascript">javascript</option>
    </select>
    <p id="selectedCurse">no curse selected</p>

    <!-- registration -->
    <form id="registrationForm">
      <input type="text" id="name" placeholder="Enter your name" required />
      <label for="">Gender</label>
      <input type="radio" name="gender" value="Male" />Male
      <input type="radio" name="gender" value="Female" />female
      <button type="submit">Register</button>
    </form>

    <p id="result"></p>
  </body>
</html>
