<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        height: 80vh;
        width: 80vw;
        gap: 10px 10px;
        display: grid;
        grid-template: repeat(3, 1fr) / repeat(3, 1fr);
        border: 1px solid;
      }
      .grid-item {
        border: 1px solid;
      }
      .grid-item-1 {
        border: 1px solid;
      }
      .grid-item-2 {
        border: 1px solid;
      }
      .grid-item-3 {
        border: 1px solid;
      }
      .grid-item-4 {
        border: 1px solid;
        grid-row: 2/3;
      }
      .grid-item-5 {
        border: 1px solid;
        height: 70px;
        grid-row: 4/5;
      }
      .grid-item-6 {
        border: 1px solid;
        grid-row: 3/4;
      }
      .grid-item-7 {
        border: 1px solid;
        grid-row: 2/5;
        grid-column: 2/4;
      }
    </style>
  </head>
  <body>
    <h1>C:</h1>
    <div class="container">
      <div class="grid-item grid-item-1">1</div>
      <div class="grid-item grid-item-2">2</div>
      <div class="grid-item grid-item-3">3</div>
      <div class="grid-item grid-item-4">4</div>
      <div class="grid-item grid-item-5">5</div>
      <div class="grid-item grid-item-6">6</div>
      <div class="grid-item grid-item-7">7</div>
    </div>
  </body>
</html>
