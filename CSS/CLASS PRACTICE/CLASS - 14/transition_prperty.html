<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>transition property</title>
    <style>
      .container {
        height: 100px;
        width: 100px;
        margin: auto;
        border: 1px solid black;
        text-align: center;
        color: aquamarine;
        background-color: rgb(62, 106, 106);
        /* transition-property: all; */
        transition-duration: 3s;
        transition-delay: 2s;
      }
    </style>
  </head>
  <body>
    <div class="container">HELLO</div>
  </body>
</html>
